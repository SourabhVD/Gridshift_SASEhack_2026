[project]
name = "gridshift-reference-backend"
version = "0.1.0"
description = "Reference implementation of the GridShift backend API contract"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ imports both `app.*` and the helpers in conftest.py by bare name.
pythonpath = [".", "tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
